<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collectify</title>
    <!-- Human report, 2026-09-14 — the browser tab showed only its own
         generic default icon; this is the same mark as CollectifyMark.tsx
         (Sidebar header/LoginPage), on the app's own --color-surface dark
         tile so it reads correctly against a light OR dark browser theme.
         WhatsappTicketWatcher.tsx swaps this SAME element's href to a
         version with a red dot while a ticket is pending, and back to
         this exact URL once resolved — see that file's own comment on
         why it mutates href in place instead of adding/removing a
         second <link>. id is load-bearing: that's how it finds this
         element again. -->
    <link id="app-favicon" rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Inter, per the Figma library (see DESIGN_TOKENS.md) — without this
         the app was silently falling back to the OS default font, which
         reads noticeably thinner/less "filled" than Inter at the light and
         medium weights used throughout (28px H1, nav items, etc.). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
